[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
sudoku-core = { path = "crates/sudoku-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Solving and generating are search-heavy; optimizing them keeps tests and dev builds fast.
[profile.dev.package.sudoku-core]
opt-level = 3

[profile.dev.package.puzzle-gen]
opt-level = 3

# The app is downloaded and run on a phone, so release builds favour small size.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.sudoku-core]
opt-level = 3

[profile.release.package.puzzle-gen]
opt-level = 3

# The app's release build. Solving for a hint runs once per tap on the phone, so
# sudoku-core is kept small there and stays fast for generating puzzles above.
[profile.wasm-release]
inherits = "release"

[profile.wasm-release.package.sudoku-core]
opt-level = "s"
